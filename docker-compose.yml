version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ${OMNIVOICE_PATH:-/opt/omnivoice}:/omnivoice-external:ro
    environment:
      - OMNIVOICE_USE_MOCK=${OMNIVOICE_USE_MOCK:-false}
      - OMNIVOICE_FALLBACK_TO_MOCK=true
      - DATABASE_URL=sqlite:///storage/omnivoice.db
      - API_KEY=${API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OMNIVOICE_INSTALL_DIR=/omnivoice-external
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/v1/health/live'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
