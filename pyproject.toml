[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-api"
version = "0.2.0"
description = "API REST multi-engine para síntesis de voz (OmniVoice, Pocket TTS, EdgeTTS)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "TTS API Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core dependencies (always installed)
dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # Logging
    "loguru>=0.7.0",
    # Audio (post-procesado en la API)
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "lameenc>=1.2.0",
    "librosa>=0.10.0",
    # Persistencia
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.19.0",
    # Observabilidad
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Seguridad / DX
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Engine: OmniVoice (GPU, full features)
omnivoice = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "huggingface_hub>=0.25.0",
]
# Engine: Pocket TTS (CPU, voice cloning, es/en/fr)
pocket_tts = [
    "pocket-tts>=3.0.0",
    "scipy>=1.11.0",
]
# Engine: EdgeTTS (cloud, 400+ voices including Catalan)
edgetts = [
    "edge-tts>=7.0.0",
]
# Auto-transcription of reference audio (optional)
transcribe = [
    "faster-whisper>=1.0.0",
]
# All engines
all-engines = [
    "tts-api[omnivoice,pocket_tts,edgetts]",
]
# Dev / test
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.24.0",
    "ipdb>=0.13.13",
]
load = [
    "locust>=2.32.0",
]

# PEP 735 dependency groups (used by uv sync --dev)
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.24.0",
    "ipdb>=0.13.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnivoice_api*"]

[tool.uv]
# Índice explícito para los paquetes de PyTorch con CUDA 12.4.
# Solo se usa para `torch` y `torchaudio` (gracias a `explicit = true`),
# el resto de dependencias se resuelven desde PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["omnivoice_api", "tests"]
exclude = [".venv", "storage", "models", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PTH", "ERA", "TID", "ARG", "C4", "N", "Q", "RUF"]
# B008: FastAPI depende de Depends()/get_settings() en default-args (idiomático).
# PLC0415: imports lazy intencionales de deps opcionales (torch, librosa, engines).
ignore = ["S101", "S311", "S603", "S607", "B008", "PLC0415"]
fixable = ["ALL"]
unfixable = ["TID252", "PTH118", "PTH120", "PTH123"]

[tool.ruff.lint.per-file-ignores]
# main.py ejecuta la configuración de event-loop policy antes de importar FastAPI.
"omnivoice_api/main.py" = ["E402", "PLW0603", "PLW0602", "ARG001"]
# Los tests usan status HTTP literales y mocks con firmas interfaz no usadas.
"tests/*" = ["PLR2004", "ARG002"]
# Los engines implementan una ABC con parámetros no usados en algunos métodos.
"omnivoice_api/core/engines/*" = ["ARG002", "PLR0913", "PLR0917"]
# Los endpoints FastAPI requieren firmas con muchos parámetros.
"omnivoice_api/api/v1/*" = ["PLR0913", "PLR0917", "ARG001"]
"omnivoice_api/core/omnivoice_engine.py" = ["PLR0913", "PLW0603"]
# Caches a nivel de módulo mantenidos con `global` (patrón deliberado).
"omnivoice_api/core/cleanup.py" = ["PLW0603", "PLW0602"]
"omnivoice_api/core/embedding_cache.py" = ["PLW0603"]
"omnivoice_api/core/engine_pool.py" = ["PLW0603"]
# Scripts y ejemplos de desarrollo (stándalone, no forman parte del paquete).
"scripts/*" = ["PLR2004", "PLW2901", "PTH123"]
"docs/examples/*" = ["PLR2004", "PTH123"]
# Hooks opcionales de la ABC de engines (warmup/close no abstractos a propósito).
"omnivoice_api/core/engine_base.py" = ["B027"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["omnivoice_api"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "pytest", "httpx", "torch"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=omnivoice_api",
    "--cov-report=term-missing",
]
markers = [
    "integration: tests de integración",
    "load: tests de carga",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["omnivoice_api"]
omit = ["tests/*", "*/conftest.py", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
