[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice-api"
version = "0.1.0"
description = "REST API sobre instalación existente de OmniVoice (k2-fsa)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "OmniVoice API Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# NOTA IMPORTANTE:
# OmniVoice NO es dependencia de este proyecto. Se consume desde una
# instalación externa:
#   C:\AI\TTS\OMNIVOICE\OMNIVOICE         (código fuente)
#   C:\AI\TTS\OMNIVOICE\omnivoice_env     (venv con CUDA/PyTorch)
# Ver docs/INSTALLATION.md y ArchitectureReview.md.
dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # Audio (post-procesado en la API)
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "lameenc>=1.2.0",
    # Persistencia
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.19.0",
    # Observabilidad
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Seguridad / DX
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.24.0",
    "ipdb>=0.13.13",
]
load = [
    "locust>=2.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnivoice_api*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["omnivoice_api", "tests"]
exclude = [".venv", "storage", "models", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PTH", "ERA", "TID", "ARG", "C4", "N", "Q", "RUF"]
ignore = ["S101", "S311", "S603", "S607"]
fixable = ["ALL"]
unfixable = ["TID252", "PTH118", "PTH120", "PTH123"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["omnivoice_api"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "pytest", "httpx"]
profile = "black"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=omnivoice_api",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "integration: tests de integración",
    "load: tests de carga",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["omnivoice_api"]
omit = ["tests/*", "*/conftest.py", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

