[project]
name = "omnivoice-api"
version = "0.1.0"
description = "API REST para síntesis de voz con OmniVoice (k2-fsa)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OmniVoice Team", email = "team@omnivoice.example"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-multipart==0.0.9",
    # OmniVoice / TTS
    "torch==2.3.0",
    "torchaudio==2.3.0",
    "k2-fsa==1.24.4",  # OmniVoice dependency
    # Audio processing
    "soundfile==0.12.1",
    "librosa==0.10.2",
    "pydub==0.25.1",
    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "aiosqlite==0.19.0",
    # Utilities
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    # Testing
    "pytest==8.2.0",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==24.5.0",
    # Quality
    "ruff==0.4.4",
    "mypy==1.10.0",
    "black==24.4.0",
    "isort==5.13.2",
]

[project.optional-dependencies]
dev = [
    "ipython==8.24.0",
    "ipdb==0.13.13",
    "pre-commit==3.7.1",
]
load = [
    "locust==2.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["omnivoice_api", "tests"]
exclude = [".venv", "storage", "models", "__pycache__", ".mypy_cache", ".ruff_cache"]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PTH", "ERA", "TID", "ARG", "C4", "N", "Q", "RUF"]
ignore = ["S101", "S311", "S603", "S607"]  # test assertions, random, subprocess, etc.
fixable = ["ALL"]
unfixable = ["TID252", "PTH118", "PTH120", "PTH123"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["omnivoice_api"]
known-third-party = ["fastapi", "pydantic", "torch", "sqlalchemy", "pytest", "httpx"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
[tool.mypy.overrides]
module = ["tests.*", "conftest"]
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=omnivoice_api",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["omnivoice_api"]
omit = ["tests/*", "*/conftest.py", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
